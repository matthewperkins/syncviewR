[package]
name = "syncviewr"
version = "0.1.3"
edition = "2024"
description = "Open Ephys + behaviour video viewer (egui + wgpu), a Rust port of syncview"
license = "MIT"
authors = ["Matthew Perkins"]

[dependencies]
anyhow = "1.0.104"
openephys = { git = "https://github.com/matthewperkins/openephys-rs" }
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
# only to switch on build-portable (below), which ffmpeg-next doesn't pass through
ffmpeg-sys-next = { version = "9", default-features = false, optional = true }
memmap2 = "0.9.11"
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
# Compile FFmpeg from source into the binary (LGPL, no external codec libraries): no system FFmpeg
# needed to build or run. Needs git, a C compiler and make (+ nasm on x86-64); the first build takes
# several minutes longer. build-portable: without it FFmpeg is compiled with -march=native, for the
# build machine's CPU only (a binary built on a newer Mac could crash on an older one), and MSVC
# rejects the flag.
static-ffmpeg = ["ffmpeg-next/build", "dep:ffmpeg-sys-next", "ffmpeg-sys-next/build-portable"]

[profile.release]
strip = true
