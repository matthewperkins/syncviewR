[package]
name = "syncviewr"
version = "0.1.0"
edition = "2024"
description = "Open Ephys + behaviour video viewer (egui + wgpu), a Rust port of syncview"
license = "MIT"
authors = ["Matthew Perkins"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
ffmpeg-next = "9"
memmap2 = "0.9.11"
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"

[profile.release]
debug = "line-tables-only"
