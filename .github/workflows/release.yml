# Build syncviewR for macOS (Apple silicon) and Windows (x64), with FFmpeg compiled in.
#
# - Push a tag like v0.1.3: builds both, creates the GitHub release if it doesn't exist, and
#   attaches syncviewr-macos-arm64.zip and syncviewr-windows-x64.zip.
# - Actions tab -> "Release binaries" -> Run workflow: builds both and keeps the zips as
#   workflow artifacts (no release), for testing.
name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: syncviewr-macos-arm64.zip
          - os: windows-latest
            asset: syncviewr-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ---- macOS: same steps as a local release build
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --features static-ffmpeg
          otool -L target/release/syncviewr
          if otool -L target/release/syncviewr | tail -n +2 | grep -v -E '^\s*(/usr/lib/|/System/Library/)'; then
            echo "::error::links to libraries outside the OS"; exit 1
          fi
          codesign --force -s - target/release/syncviewr

      # ---- Windows: FFmpeg's configure needs a POSIX shell, make and nasm (MSYS2), and the
      # MSVC compiler in the environment.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MSYS
          update: false
          install: make nasm diffutils pkgconf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          # MSYS2's coreutils `link` would shadow MSVC's link.exe (which msvc-dev-cmd put first)
          Remove-Item "$msys\link.exe" -ErrorAction SilentlyContinue
          # MSYS2's sh, make and awk ahead of Git for Windows' and MinGW's, which break FFmpeg's
          # dependency rules; MSVC's cl and link still come first
          $msvc = ($env:PATH -split ';' | Where-Object { $_ -match 'Microsoft Visual Studio|Windows Kits' }) -join ';'
          $env:PATH = "$msvc;$msys;$env:PATH"
          where.exe sh make awk cl link
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          cargo build --release --features static-ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: FFmpeg configure log (on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path target -Filter config.log -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          where.exe link cl sh make nasm

      # ---- smoke test: write the demo (encodes its video with the built-in FFmpeg) and build
      # its filtered traces, without a window
      - name: Smoke test
        shell: bash
        run: |
          exe=target/release/syncviewr
          [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          "$exe" --demo "$RUNNER_TEMP/demo" --cache "$RUNNER_TEMP/cache" --build-only
          # and a 2-second clip through this platform's encoder
          mkdir -p clip-test
          "$exe" --demo "$RUNNER_TEMP/demo" --cache "$RUNNER_TEMP/cache" --export-clip clip-test/demo-clip-$RUNNER_OS.mp4 --clip-from 20 --clip-to 22
          ls -l clip-test

      # ---- Windows GUI check: open the start page, and the viewer on the demo, and save
      # screenshots (the runner draws with Windows' software renderer)
      - name: Screenshots (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path target\release\syncviewr.exe).Path
          $out = New-Item -ItemType Directory -Force -Path windows-screenshots
          function Shot($name, $argline) {
            $p = Start-Process -FilePath $exe -ArgumentList $argline -PassThru `
              -RedirectStandardError "$out\$name.stderr.txt" -RedirectStandardOutput "$out\$name.stdout.txt"
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "${name}: timed out" }
            "${name}: exit code $($p.ExitCode)"
            if (Test-Path "$out\$name.ppm") { magick "$out\$name.ppm" "$out\$name.png"; Remove-Item "$out\$name.ppm" }
            Get-Content "$out\$name.stderr.txt" -ErrorAction SilentlyContinue
          }
          Shot "start-page" "--screenshot `"$out\start-page.ppm`" --screenshot-after 6"
          Shot "viewer-demo" "--demo `"$env:RUNNER_TEMP\demo`" --cache `"$env:RUNNER_TEMP\cache`" --screenshot `"$out\viewer-demo.ppm`" --screenshot-after 12"
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-screenshots
          path: windows-screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: clip-test-${{ runner.os }}
          path: clip-test
          if-no-files-found: warn

      - name: Package
        shell: bash
        run: |
          cd target/release
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k syncviewr "$GITHUB_WORKSPACE/${{ matrix.asset }}"
          else
            7z a "$GITHUB_WORKSPACE/${{ matrix.asset }}" syncviewr.exe
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" syncviewr-*.zip --repo "$GITHUB_REPOSITORY" --clobber
